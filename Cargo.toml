[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["bindings/python", "bindings/node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
async-trait = "0.1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
data-encoding = "2.11"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast", "zeroize", "signature"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = { version = "0.13", features = ["zeroize"] }
iroh = { version = "1.5", default-features = false, features = ["tls-ring", "portmapper"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4"
sha2 = { version = "0.11", features = ["zeroize"] }
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-curve25519", "use-sha2", "use-getrandom"] }
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "3.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
tendril-core = { path = "crates/tendril-core" }
tendril-relay = { path = "crates/tendril-relay" }
tendril-runtime = { path = "crates/tendril-runtime" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package.argon2]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
