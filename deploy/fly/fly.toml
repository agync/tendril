# Single-machine Fly.io configuration for tendril-relay.
# Always launch or scale with a single machine because mailbox state is held in memory:
#   fly launch --copy-config --ha=false
#   fly secrets set TENDRIL_RELAY_AUTH_SECRET="$(openssl rand -hex 32)"

[build]
  image = "ghcr.io/agync/tendril-relay:latest"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
