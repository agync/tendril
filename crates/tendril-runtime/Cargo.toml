[package]
name = "tendril-runtime"
description = "Async Tokio runtime, path providers, rate limits, and persistence for Tendril."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
p2p-iroh = ["dep:iroh"]
p2p-iroh-services = ["p2p-iroh", "dep:iroh-services", "dep:data-encoding"]

[dependencies]
async-trait.workspace = true
data-encoding = { workspace = true, optional = true }
ed25519-dalek.workspace = true
futures-util.workspace = true
iroh = { workspace = true, optional = true }
iroh-services = { workspace = true, optional = true }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tendril-core.workspace = true
tendril-relay.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

# std `File::lock` is unsupported on Android; the state store takes its `flock` through rustix there.
[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
iroh-relay = { version = "1.5", features = ["server"] }
tempfile.workspace = true

[lints]
workspace = true
