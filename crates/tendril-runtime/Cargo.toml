[package]
name = "tendril-runtime"
description = "Async Tokio runtime, path providers, rate limits, and persistence for Tendril."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
p2p-iroh = ["dep:iroh"]
p2p-iroh-services = ["p2p-iroh", "dep:iroh-services", "dep:data-encoding"]
# Native interface enumeration for `advertise: auto` hosts (not used on Android).
auto-advertise = ["dep:netdev"]
webtransport = ["dep:wtransport"]
webrtc = ["dep:str0m", "dep:str0m-rust-crypto"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
data-encoding = { workspace = true, optional = true }
ed25519-dalek.workspace = true
futures-util.workspace = true
h2.workspace = true
http.workspace = true
iroh = { workspace = true, optional = true }
iroh-services = { workspace = true, optional = true }
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2 = "0.6"
str0m = { workspace = true, optional = true }
str0m-rust-crypto = { workspace = true, optional = true }
subtle.workspace = true
tendril-core.workspace = true
tendril-relay.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
webpki-roots.workspace = true
wtransport = { workspace = true, optional = true }
zeroize.workspace = true

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
netdev = { version = "0.47", default-features = false, optional = true }

# std `File::lock` is unsupported on Android; the state store takes its `flock` through rustix there.
[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
iroh-relay = { version = "1.5", features = ["server"] }
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
