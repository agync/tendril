[package]
name = "tendril-core"
description = "Core identity, pairing, sealed session, grant, and path-policy primitives for Tendril."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
test-utils = []

[dependencies]
argon2.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
fips203.workspace = true
fips204.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
poly1305.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
url.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Enables `test-utils` (the forging `EndpointIdentity::with_host_id`) for tests, examples and benches.
tendril-core = { path = ".", features = ["test-utils"] }

[lints]
workspace = true
