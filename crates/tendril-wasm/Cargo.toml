[package]
name = "tendril-wasm"
description = "Sans-I/O WebAssembly core bindings over tendril-core via wasm-bindgen."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
p2p-iroh = ["dep:futures-util", "dep:iroh", "dep:n0-future", "dep:ring", "dep:wasm-bindgen-futures"]

[dependencies]
futures-util = { version = "0.3", optional = true }
iroh = { version = "1.5", default-features = false, features = ["tls-ring"], optional = true }
n0-future = { version = "0.3", optional = true }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"], optional = true }
serde.workspace = true
serde_json.workspace = true
tendril-core.workspace = true
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[lints]
workspace = true
