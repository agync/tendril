[package]
name = "tendril-cli"
description = "Tendril reference CLI and JSON conformance driver binary."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "tendril"
path = "src/main.rs"

[[bin]]
name = "tendril-conformance-peer"
path = "src/bin/conformance_peer.rs"

[features]
default = []
p2p-iroh-services = ["tendril-runtime/p2p-iroh-services"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tendril-core.workspace = true
tendril-runtime = { workspace = true, features = ["p2p-iroh", "webtransport", "webrtc"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tendril-relay.workspace = true

[lints]
workspace = true
