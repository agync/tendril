[package]
name = "tendril-ffi"
description = "Polled C ABI (callback-free except optional external ML-DSA-65 custody callbacks) over tendril-core and tendril-runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["p2p-iroh", "auto-advertise"]
auto-advertise = ["tendril-runtime/auto-advertise"]
p2p-iroh = ["tendril-runtime/p2p-iroh"]
p2p-iroh-services = ["p2p-iroh", "tendril-runtime/p2p-iroh-services"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tendril-core.workspace = true
tendril-runtime.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
bytes.workspace = true
h2.workspace = true
http.workspace = true
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tempfile.workspace = true
tendril-relay.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
