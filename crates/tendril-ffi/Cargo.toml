[package]
name = "tendril-ffi"
description = "Callback-free polled C ABI over tendril-core and tendril-runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["p2p-iroh"]
p2p-iroh = ["tendril-runtime/p2p-iroh"]
p2p-iroh-services = ["p2p-iroh", "tendril-runtime/p2p-iroh-services"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tendril-core.workspace = true
tendril-runtime.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
tendril-relay.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
