[package]
name = "tendril-relay"
description = "Stateless WebSocket ciphertext relay implementing Tendril relay-v1."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
ed25519-dalek.workspace = true
futures-util.workspace = true
clap.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
tendril-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true

[features]
# Test seams (fake clock, ordering hooks). Never enable outside test targets.
test-hooks = []

[dev-dependencies]
tempfile.workspace = true
tendril-relay = { path = ".", features = ["test-hooks"] }

[[test]]
name = "relay_hardening"
required-features = ["test-hooks"]

[[test]]
name = "relay_lifecycle"
required-features = ["test-hooks"]

[[test]]
name = "relay_server"
required-features = ["test-hooks"]

[[test]]
name = "relay_v2"
required-features = ["test-hooks"]

[lints]
workspace = true
