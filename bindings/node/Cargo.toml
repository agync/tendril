[package]
name = "tendril-node"
description = "Node.js N-API native addon over tendril-core and tendril-runtime."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/agync/tendril"
homepage = "https://tendril.agync.dev"

[lib]
name = "tendril_node"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "serde-json", "tokio_rt"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendril-core = { path = "../../crates/tendril-core" }
tendril-runtime = { path = "../../crates/tendril-runtime", features = ["p2p-iroh", "auto-advertise"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zeroize = { version = "1.9", features = ["derive"] }

[features]
default = []
p2p-iroh-services = ["tendril-runtime/p2p-iroh-services"]

[build-dependencies]
napi-build = "2"

[lints.rust]
# napi-derive 3 registers exports with code marked allow(unsafe_code),
# which forbid would reject. deny still rejects unsafe in this crate.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]

[profile.dev.package.argon2]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
