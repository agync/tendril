[package]
name = "tendril-py"
description = "Python PyO3 extension module over tendril-core and tendril-runtime."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91"
repository = "https://github.com/agync/tendril"
homepage = "https://tendril.agync.dev"

[lib]
name = "_tendril"
crate-type = ["cdylib"]

[features]
default = []
p2p-iroh-services = ["tendril-runtime/p2p-iroh-services"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py39"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tendril-core = { path = "../../crates/tendril-core" }
tendril-runtime = { path = "../../crates/tendril-runtime", features = ["p2p-iroh"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zeroize = { version = "1.9", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[workspace]

[profile.dev.package.argon2]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
