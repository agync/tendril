# Declarative hook configuration. Installed by `make setup`.
# `make check` runs the same hooks CI runs.
default_install_hook_types: [pre-commit, commit-msg]
# Keep pre-commit hooks scoped to commits unless commit-msg is explicitly set.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: '\.sh$'

  - repo: local
    hooks:
      - id: no-scratch-area
        name: reject anything staged under the scratch area
        entry: the scratch area under .agents/brain/ is never committed
        language: fail
        files: '^\.agents/brain/'

      - id: no-em-dash
        name: reject en-dashes and em-dashes
        entry: '\xe2\x80[\x93\x94]'
        language: pygrep
        types: [text]

      - id: no-em-dash-msg
        name: reject en-dashes and em-dashes in commit messages
        entry: '\xe2\x80[\x93\x94]'
        language: pygrep
        stages: [commit-msg]

      - id: no-home-paths
        name: reject host-specific home paths
        entry: '(/home/|/Users/|/root/)[A-Za-z][A-Za-z0-9_.-]*'
        language: pygrep
        types: [text]

      - id: no-home-paths-msg
        name: reject host-specific home paths in commit messages
        entry: '(/home/|/Users/|/root/)[A-Za-z][A-Za-z0-9_.-]*'
        language: pygrep
        stages: [commit-msg]

      - id: no-file-uri
        name: reject local file URIs
        entry: 'file://'
        language: pygrep
        types: [text]
        exclude: '^\.pre-commit-config\.yaml$'

      - id: no-trailers
        name: reject commit message trailers
        entry: '^([A-Za-z]+(-[A-Za-z]+)+|Refs|Fixes|Closes|Cc|Link|Change-Id): '
        language: pygrep
        args: [-i]
        stages: [commit-msg]

      - id: cargo-fmt
        name: rustfmt check
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: okf-bundle
        name: validate the OKF v0.2 docs bundle
        entry: make --no-print-directory docs/check
        language: system
        files: '^docs/'
        pass_filenames: false
