version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      workspace-crates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/bindings/python"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      python-crates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/bindings/node"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      # napi and napi-derive must share a major version; bump them together.
      napi:
        patterns: ["napi", "napi-*"]
      node-crates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: "/bindings/go"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: "/spec/vectors/verify_go"
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: "/bindings/kotlin"
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/bindings/web"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/bindings/node"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: friday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
