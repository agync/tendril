name: Rust toolchain
description: Install the pinned toolchain, optional targets, and prune preinstalled extras.

inputs:
  targets:
    description: Space-separated rustup targets to install for the pinned toolchain
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain only
      shell: bash
      env:
        TARGET_LIST: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        rustup toolchain install
        pinned=$(sed -n \
          's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
          rust-toolchain.toml)
        if [ -z "$pinned" ]; then
          echo "rust-toolchain.toml has no channel" >&2
          exit 1
        fi
        rustup default "$pinned"
        if [ -n "$TARGET_LIST" ]; then
          read -r -a targets <<< "$TARGET_LIST"
          rustup target add --toolchain "$pinned" "${targets[@]}"
        fi
        all=$(rustup toolchain list --quiet) || {
          echo "could not read rustup's toolchain list" >&2
          exit 1
        }
        extras=$(printf '%s\n' "$all" | tr -d '\r' |
          awk -v keep="$pinned" 'index($0, keep) != 1 && NF')
        if [ -n "$extras" ]; then
          while read -r toolchain; do
            rustup toolchain uninstall "$toolchain"
          done <<< "$extras"
        fi
