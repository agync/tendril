name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-app
    permissions:
      contents: read
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_branch: ${{ steps.pr-meta.outputs.pr_branch }}
      version: ${{ steps.pr-meta.outputs.version }}
    steps:
      - name: Get GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/rust-toolchain

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Refresh Cargo lockfiles on release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          PRS: ${{ steps.release.outputs.prs }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PRS" | jq -r '.[0].headBranchName')"
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            echo "no release PR branch reported"
            exit 0
          fi
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git fetch origin "$branch"
          git checkout -B "$branch" FETCH_HEAD
          version=$(python3 -I - <<'PY'
          import tomllib
          print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])
          PY
          )
          cargo update --workspace
          cargo update --manifest-path bindings/python/Cargo.toml --workspace
          cargo update --manifest-path bindings/node/Cargo.toml --workspace
          git add Cargo.lock bindings/python/Cargo.lock bindings/node/Cargo.lock
          if git diff --cached --quiet; then
            echo "lockfiles already at $version"
            exit 0
          fi
          git config user.name "agync-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh lockfiles for $version"
          git push origin "$branch"

      - name: Export release PR metadata
        id: pr-meta
        if: steps.release.outputs.prs_created == 'true'
        env:
          PRS: ${{ steps.release.outputs.prs }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="$(printf '%s' "$PRS" | jq -r '.[0].headBranchName // empty')"
          if [ -z "$branch" ] || [ "$branch" = "null" ]; then
            exit 0
          fi
          if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$branch" == -* ]]; then
            echo "unexpected PR branch name: $branch" >&2
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git fetch origin "$branch"
          git show "FETCH_HEAD:.release-please-manifest.json" > "$RUNNER_TEMP/rp-manifest.json"
          version=$(python3 -I - "$RUNNER_TEMP/rp-manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              print(json.load(fh)["."])
          PY
          )
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected release version: $version" >&2
            exit 1
          fi
          {
            echo "pr_branch=$branch"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Create Go submodule tag for release
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES_JSON: ${{ toJSON(steps.release.outputs) }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          version=$(python3 -I - <<'PY'
          import json
          with open(".release-please-manifest.json", encoding="utf-8") as fh:
              print(json.load(fh)["."])
          PY
          )
          tag="v${version}"
          go_tag="bindings/go/${tag}"
          git fetch origin tag "$tag"
          commit=$(git rev-list -n 1 "refs/tags/${tag}")
          if git ls-remote --exit-code --tags origin "refs/tags/${go_tag}" >/dev/null 2>&1; then
            echo "$go_tag already exists"
            exit 0
          fi
          git tag "$go_tag" "$commit"
          git push origin "refs/tags/${go_tag}"
          printf '%s\n' "$RELEASES_JSON" >/dev/null

  apple-release-pr:
    name: Apple XCFramework checksum for release PR
    needs: release-please
    if: >-
      needs.release-please.outputs.prs_created == 'true'
      && needs.release-please.outputs.pr_branch != ''
      && needs.release-please.outputs.version != ''
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build XCFramework and compute checksum
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release version: $VERSION" >&2
            exit 1
          fi
          zip_path="$RUNNER_TEMP/TendrilFFI.xcframework-${VERSION}.zip"
          built_sha=$(scripts/build-xcframework.sh "$VERSION" "$zip_path")
          swift_sha=$(swift package compute-checksum "$zip_path")
          if [ "$built_sha" != "$swift_sha" ]; then
            echo "checksum mismatch: packer=$built_sha swift=$swift_sha" >&2
            exit 1
          fi
          if ! [[ "$swift_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "unexpected checksum format: $swift_sha" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apple-checksum"
          printf '%s\n' "$swift_sha" > "$RUNNER_TEMP/apple-checksum/checksum.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-checksum
          path: ${{ runner.temp }}/apple-checksum/checksum.txt
          retention-days: 7

  commit-apple-manifest:
    name: Commit Package.swift checksum to release PR
    needs: [release-please, apple-release-pr]
    if: >-
      needs.release-please.outputs.prs_created == 'true'
      && needs.release-please.outputs.pr_branch != ''
      && needs.release-please.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-app
    permissions:
      contents: read
    steps:
      - name: Get GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-checksum
          path: ${{ runner.temp }}/apple-checksum
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          persist-credentials: false
      - name: Update Package.swift checksum and push
        env:
          PR_BRANCH: ${{ needs.release-please.outputs.pr_branch }}
          VERSION: ${{ needs.release-please.outputs.version }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$PR_BRANCH" == -* ]]; then
            echo "invalid PR branch: $PR_BRANCH" >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release version: $VERSION" >&2
            exit 1
          fi
          checksum_file="${RUNNER_TEMP}/apple-checksum/checksum.txt"
          test -f "$checksum_file"
          checksum=$(tr -d '[:space:]' < "$checksum_file")
          if ! [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "invalid checksum in artifact: $checksum" >&2
            exit 1
          fi
          manifest_version=$(python3 -I - <<'PY'
          import json
          with open(".release-please-manifest.json", encoding="utf-8") as fh:
              print(json.load(fh)["."])
          PY
          )
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "manifest version $manifest_version != $VERSION" >&2
            exit 1
          fi
          python3 -I - "$VERSION" "$checksum" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, checksum = sys.argv[1], sys.argv[2]
          path = Path("Package.swift")
          text = path.read_text(encoding="utf-8")
          text, n_ver = re.subn(
              r'^let tendrilReleaseVersion = "[^"]+"$',
              f'let tendrilReleaseVersion = "{version}"',
              text,
              count=2,
              flags=re.M,
          )
          text, n_sha = re.subn(
              r'^let tendrilXCFrameworkChecksum = "[0-9a-f]{64}"$',
              f'let tendrilXCFrameworkChecksum = "{checksum}"',
              text,
              count=2,
              flags=re.M,
          )
          if n_ver != 1 or n_sha != 1:
              raise SystemExit(f"expected exactly 1 match for version ({n_ver}) and checksum ({n_sha})")
          path.write_text(text, encoding="utf-8")
          PY
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "Package.swift already at $VERSION ($checksum)"
            exit 0
          fi
          if [ "$changed" != "Package.swift" ]; then
            echo "unexpected modified files: $changed" >&2
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git add Package.swift
          git config user.name "agync-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Package.swift checksum for $VERSION"
          git push origin "HEAD:refs/heads/${PR_BRANCH}"
