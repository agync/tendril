name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      rust-platforms: ${{ steps.paths.outputs.rust-platforms }}
      vectors-go: ${{ steps.paths.outputs.vectors-go }}
      python: ${{ steps.paths.outputs.python }}
      node: ${{ steps.paths.outputs.node }}
      web: ${{ steps.paths.outputs.web }}
      android: ${{ steps.paths.outputs.android }}
      apple: ${{ steps.paths.outputs.apple }}
      site: ${{ steps.paths.outputs.site }}
      container: ${{ steps.paths.outputs.container }}
      scripts: ${{ steps.paths.outputs.scripts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/changed"
          if [ "$EVENT" = "pull_request" ] &&
            git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$changed"; then
            cat "$changed"
            scripts/ci-areas.sh < "$changed" > "$RUNNER_TEMP/areas"
          else
            scripts/ci-areas.sh --all > "$RUNNER_TEMP/areas"
          fi
          cat "$RUNNER_TEMP/areas" >> "$GITHUB_OUTPUT"
          {
            echo "### Jobs selected"
            echo
            sed 's/^/- /; s/=/: /' "$RUNNER_TEMP/areas"
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: hygiene and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install okf, actionlint, and pre-commit
        env:
          OKF_VERSION: "0.5.2"
          OKF_SHA256: "05ecf191f1ef1396cdeefa9a1fd877d491b32b91f2a4a4d06393656e880e90b6"
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          okf_tgz="okf_${OKF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$okf_tgz" \
            "https://github.com/okfcli/okf/releases/download/v${OKF_VERSION}/${okf_tgz}"
          echo "${OKF_SHA256}  $RUNNER_TEMP/${okf_tgz}" | sha256sum --check --status -
          tar -xzf "$RUNNER_TEMP/$okf_tgz" -C "$HOME/.local/bin" okf

          al_tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$al_tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${al_tgz}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/${al_tgz}" | sha256sum --check --status -
          tar -xzf "$RUNNER_TEMP/$al_tgz" -C "$HOME/.local/bin" actionlint

          python3 -m pip install --quiet --require-hashes -r .github/requirements-hygiene.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run actionlint
        run: actionlint .github/workflows/*.yml
      - name: Run pre-commit hooks
        env:
          SKIP: cargo-fmt
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows .github/actions
          config: .github/zizmor.yml
          online-audits: "false"
          advanced-security: "false"
          annotations: "true"
          fail-on-no-inputs: "true"

  scripts:
    name: helper scripts
    needs: changes
    if: needs.changes.outputs.scripts != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s scripts -v

  rust:
    name: rust workspace
    needs: changes
    if: needs.changes.outputs.rust != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-core
          cache-on-failure: true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo check -p tendril-ffi --no-default-features
      - run: cargo test --workspace
      - run: make test

  vectors-go:
    name: vectors and Go bindings
    needs: changes
    if: needs.changes.outputs.vectors-go != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-go
          cache-on-failure: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: spec/vectors/verify_go/go.sum
      - run: make vectors/check bindings/go

  bindings-python:
    name: Python bindings
    needs: changes
    if: needs.changes.outputs.python != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-py
          workspaces: |
            .
            bindings/python
          cache-on-failure: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: cargo fmt --manifest-path bindings/python/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings
      - run: make bindings/python

  bindings-node:
    name: Node.js bindings
    needs: changes
    if: needs.changes.outputs.node != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-node
          workspaces: |
            .
            bindings/node
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: cargo fmt --manifest-path bindings/node/Cargo.toml -- --check
      - run: cargo clippy --manifest-path bindings/node/Cargo.toml --all-targets -- -D warnings
      - run: make bindings/node

  bindings-web:
    name: Web WASM SDK and Chrome E2E
    needs: changes
    if: needs.changes.outputs.web != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-wasm
          cache-on-failure: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned wasm-bindgen-cli
        env:
          WB_VERSION: "0.2.130"
          WB_SHA256: "9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f"
        run: |
          set -euo pipefail
          tgz="wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WB_VERSION}/${tgz}"
          echo "${WB_SHA256}  $RUNNER_TEMP/${tgz}" | sha256sum --check --status -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tgz" --strip-components=1 -C "$HOME/.local/bin" \
            "wasm-bindgen-${WB_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Ensure clang and Chromium
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq clang llvm
          fi
          test -x /usr/bin/google-chrome || test -x /usr/bin/chromium || test -x /usr/bin/chromium-browser
      - run: make bindings/web
      - run: make relay/cloudflare

  bindings-android:
    name: Android NDK and Kotlin JNI
    needs: changes
    if: needs.changes.outputs.android != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-android
          cache-on-failure: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.6.1"
          cache-provider: basic
      - name: Ensure Android NDK 27 and CMake
        env:
          NDK_VER: "27.1.12297006"
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -d "$sdkroot/ndk/$NDK_VER" ] || [ ! -d "$sdkroot/cmake/3.22.1" ]; then
            "$sdkroot/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" "cmake;3.22.1" >/dev/null
          fi
          echo "ANDROID_NDK_HOME=$sdkroot/ndk/$NDK_VER" >> "$GITHUB_ENV"
      - run: make bindings/jni bindings/android
      - run: gradle -p bindings/kotlin --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" assembleDebugAndroidTest testDebugUnitTest lint

  bindings-apple:
    name: Apple SwiftPM and iOS FFI
    needs: changes
    if: >-
      needs.changes.outputs.apple != 'false'
      || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--'))
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-apple
          cache-on-failure: true
      - run: cargo build -p tendril-relay --bin tendril-relay
      - run: cargo build -p tendril-cli --bin tendril-conformance-peer
      - run: cargo build --release --target aarch64-apple-darwin -p tendril-ffi --lib
      - name: Verify macOS SwiftPM tests
        working-directory: bindings/swift
        run: swift test -Xlinker "-L../../target/aarch64-apple-darwin/release"
      - name: Verify root remote Package.swift manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          env -u TENDRIL_LOCAL_FFI swift package dump-package > "$RUNNER_TEMP/remote-package.json"
          python3 -I - "$RUNNER_TEMP/remote-package.json" <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          pkg = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert pkg["name"] == "Tendril", pkg["name"]
          targets = {t["name"]: t for t in pkg["targets"]}
          ctendril = targets["CTendril"]
          assert ctendril["type"] == "binary", ctendril

          manifest = Path("Package.swift").read_text(encoding="utf-8")
          ver_m = re.search(r'^let tendrilReleaseVersion = "([^"]+)"$', manifest, re.M)
          sha_m = re.search(r'^let tendrilXCFrameworkChecksum = "([0-9a-f]{64})"$', manifest, re.M)
          assert ver_m and sha_m, "missing release constants in Package.swift"
          pkg_ver, pkg_sha = ver_m.group(1), sha_m.group(1)

          expected_url = (
              f"https://github.com/agync/tendril/releases/download/"
              f"v{pkg_ver}/TendrilFFI.xcframework-{pkg_ver}.zip"
          )
          assert ctendril["url"] == expected_url, (ctendril.get("url"), expected_url)
          assert ctendril["checksum"] == pkg_sha, (ctendril.get("checksum"), pkg_sha)
          assert "unsafeFlags" not in json.dumps(pkg), "remote manifest must not contain unsafeFlags"

          if os.environ.get("EVENT_NAME") == "pull_request" and os.environ.get("HEAD_REF", "").startswith("release-please--"):
              rp_manifest = json.loads(Path(".release-please-manifest.json").read_text(encoding="utf-8"))
              expected_ver = rp_manifest["."]
              assert pkg_ver == expected_ver, (
                  f"release PR Package.swift version {pkg_ver} != .release-please-manifest.json {expected_ver}"
              )
              assert re.fullmatch(r"[0-9a-f]{64}", pkg_sha) and pkg_sha != "0" * 64, (
                  f"release PR Package.swift checksum must be finalized (got {pkg_sha})"
              )
          PY
      - name: Verify root local SwiftPM tests
        env:
          TENDRIL_LOCAL_FFI: "1"
        run: swift test -Xlinker "-Ltarget/aarch64-apple-darwin/release"
      - name: Build and verify TendrilFFI.xcframework smoke link
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/TendrilFFI.xcframework-0.1.0.zip"
          built_sha=$(scripts/build-xcframework.sh "0.1.0" "$zip_path")
          swift_sha=$(swift package compute-checksum "$zip_path")
          if [ "$built_sha" != "$swift_sha" ]; then
            echo "checksum mismatch: packer=$built_sha swift=$swift_sha" >&2
            exit 1
          fi

          smoke_dir="$RUNNER_TEMP/xcframework-smoke"
          rm -rf "$smoke_dir"
          mkdir -p "$smoke_dir/Sources"
          unzip -q "$zip_path" -d "$smoke_dir"
          fw_dir="$smoke_dir/TendrilFFI.xcframework"
          test -f "$fw_dir/Info.plist"
          python3 -I - "$fw_dir" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          fw = Path(sys.argv[1])
          plist = plistlib.loads((fw / "Info.plist").read_bytes())
          libs = plist.get("AvailableLibraries", [])
          assert len(libs) == 3, libs
          platforms = {
              (entry.get("SupportedPlatform"), entry.get("SupportedPlatformVariant"))
              for entry in libs
          }
          assert platforms == {("macos", None), ("ios", None), ("ios", "simulator")}, platforms
          for entry in libs:
              slice_dir = fw / entry["LibraryIdentifier"]
              assert (slice_dir / entry["LibraryPath"]).is_file(), slice_dir
              headers_dir = slice_dir / entry["HeadersPath"]
              assert (headers_dir / "tendril.h").is_file(), headers_dir
              assert (headers_dir / "tendril.h").read_bytes() == Path(
                  "crates/tendril-ffi/include/tendril.h"
              ).read_bytes(), headers_dir
              mm = (headers_dir / "module.modulemap").read_text(encoding="utf-8")
              assert mm == 'module CTendril [system] {\n  header "tendril.h"\n  export *\n}\n', mm
              assert "module CTendril [system]" in mm, mm
              assert 'header "tendril.h"' in mm, mm
              assert "export *" in mm, mm
          local_mm = Path(
              "bindings/swift/Sources/CTendril/include/module.modulemap"
          ).read_text(encoding="utf-8")
          assert "module CTendril [system]" in local_mm, local_mm
          PY

          cat > "$smoke_dir/Package.swift" <<'SWIFT'
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
            name: "XCFrameworkSmoke",
            platforms: [.macOS(.v13)],
            targets: [
              .binaryTarget(
                name: "CTendril",
                path: "TendrilFFI.xcframework"
              ),
              .executableTarget(
                name: "XCFrameworkSmoke",
                dependencies: ["CTendril"],
                path: "Sources",
                linkerSettings: [
                  .linkedFramework("CoreFoundation"),
                  .linkedFramework("Network"),
                  .linkedFramework("Security"),
                  .linkedFramework("SystemConfiguration"),
                  .linkedLibrary("resolv"),
                ]
              ),
            ]
          )
          SWIFT

          cat > "$smoke_dir/Sources/main.swift" <<'SWIFT'
          import CTendril
          import Foundation

          var key = [UInt8](repeating: 0x42, count: Int(TENDRIL_KEY_LEN))
          var outPtr: UnsafeMutablePointer<CChar>?
          let rc = key.withUnsafeBufferPointer { buf in
            tendril_device_id(buf.baseAddress, &outPtr)
          }
          guard rc == TENDRIL_OK.rawValue, let ptr = outPtr else {
            fatalError("tendril_device_id failed: \(rc)")
          }
          let id = String(cString: ptr)
          tendril_string_free(ptr)
          precondition(id.hasPrefix("dev_"), "unexpected device id: \(id)")
          print("xcframework smoke ok: \(id)")
          SWIFT

          swift run --package-path "$smoke_dir"

  rust-platforms:
    name: cross-platform (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust-platforms != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-plat
          cache-on-failure: true
      - if: runner.os != 'Windows'
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
      - if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p tendril-runtime
          cargo clippy -p tendril-core -p tendril-relay --all-targets -- -D warnings
          cargo test -p tendril-core --all-targets
          cargo test -p tendril-relay --lib

  site:
    name: website and docs check
    needs: changes
    if: needs.changes.outputs.site != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install pinned okf and validate docs strictly
        env:
          OKF_VERSION: "0.5.2"
          OKF_SHA256: "05ecf191f1ef1396cdeefa9a1fd877d491b32b91f2a4a4d06393656e880e90b6"
        run: |
          set -euo pipefail
          okf_tgz="okf_${OKF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$okf_tgz" \
            "https://github.com/okfcli/okf/releases/download/v${OKF_VERSION}/${okf_tgz}"
          echo "${OKF_SHA256}  $RUNNER_TEMP/${okf_tgz}" | sha256sum --check --status -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$okf_tgz" -C "$HOME/.local/bin" okf
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          report=$("$HOME/.local/bin/okf" validate docs)
          python3 -I - "$report" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get("errors", 0) or data.get("warnings", 0):
              print(json.dumps(data, indent=2), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Build site and themed docs
        run: |
          set -euo pipefail
          make site PODMAN=/nonexistent
          test -s site/dist/index.html
          test -s site/dist/docs/index.html
          test -s site/dist/docs/search-index.json
      - name: Install site Playwright dependencies
        working-directory: site
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run site accessibility and browser checks
        run: |
          set -euo pipefail
          python3 -I site/scripts/serve.py site/dist 4180 > "$RUNNER_TEMP/serve.log" 2>&1 &
          srv_pid=$!
          trap 'kill "$srv_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4180/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/serve.log" >&2
            exit 1
          fi
          node site/scripts/check.mjs http://127.0.0.1:4180
      - name: Upload failed site check screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-check
          path: site/build/check
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: container build check
    needs: changes
    if: needs.changes.outputs.container != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ghcr.io/agync/tendril-relay
          tags: check
          containerfiles: Containerfile
          context: .

  gate:
    name: gate
    if: always()
    needs:
      - changes
      - hygiene
      - scripts
      - rust
      - vectors-go
      - bindings-python
      - bindings-node
      - bindings-web
      - bindings-android
      - bindings-apple
      - rust-platforms
      - site
      - container
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          PASSED: >-
            ${{ needs.changes.result == 'success'
            && !contains(needs.*.result, 'failure')
            && !contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          test "$PASSED" = "true"
